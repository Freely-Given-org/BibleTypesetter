# OET publication data shared by the two engine settings files.
# Relative filesystem paths are resolved beside the TOML that declares them.
page_numbers = "outside"

[publication]
id = "OET"
default_version = "OET"
title = "Open English Translation\nof the Bible"
author = "Open English Translation"
running_title = "OPEN ENGLISH TRANSLATION"
copyright_heading = "Copyright and licence"
copyright_title = "Copyright and open licence"
draft_template = "Open English Translation · Translation draft {version} · OET.Bible"
copyright = "Copyright © 2010-2026 Freely-Given.org."
licence = "Creative Commons Attribution-ShareAlike 4.0 International (CC BY-SA 4.0)"
licence_url = "https://creativecommons.org/licenses/by-sa/4.0/"
intro_licence = "{copyright} CC BY-SA 4.0. {licence_url}"
cover_credit = "OET.Bible · Freely-Given.org"
reading_url = "https://Freely-Given.org/OBD/OET/byDoc/{code}.htm#Top"
collection_url = "https://Freely-Given.org/OBD/OET/bySec/"
copyright_paragraphs = ["{draft_credit}", "{copyright}", "This translation is made available under the {licence} licence.", "You may copy, share and print this translation under that licence. Preserve its copyright and attribution, and share adaptations under the same licence. The OET publication guidelines ask that an adapted translation use a different name.", "Licence: https://creativecommons.org/licenses/by-sa/4.0/", "The Readers’ Version presents the meaning in modern English. The Literal Version helps readers examine the wording of the source languages. The two versions are designed to be read together.", "This translation is still a draft. The overall draft version is shown above; the end of each book shows the Readers’ Version book revision or the Literal Version set release, or both in the parallel edition.", "Project and publication guidelines: https://OpenEnglishTranslation.Bible/About/Licence", "Source files: https://github.com/Freely-Given-org/OpenEnglishTranslation--OET"]
legend = ["Lighter type marks additions. Underscores join parts of a single source word.", "Struck words are untranslated. The ◘ sign marks a verse with no text."]

[editions.OET]
sides = ["rv", "lv"]
label = "Parallel reading edition"
[editions.OET-RV]
sides = ["rv"]
label = "Readers’ Version"
[editions.OET-LV]
sides = ["lv"]
label = "Literal Version"

[sources]
root = "/srv/FreelyGiven/OpenEnglishTranslation--OET"
[sources.rv]
id = "OET-RV"
label = "Readers’ Version"
note_label = "RV"
patterns = ["translatedTexts/ReadersVersion/OET-RV_{code}.ESFM"]
[sources.lv]
id = "OET-LV"
label = "Literal Version"
note_label = "LV"
patterns = ["derivedTexts/*/OET-LV_{code}.ESFM"]
release_file = "version.json"
release_resource = "OET-LV"
text_replacements = { "+" = "_", "=" = "_" }

[preprocessing]
strip_word_ids = true
strip_addition_codes = true
strip_discourse_markers = true
remove_characters = ["⇔"]
remove_prefixes = ["≈"]

[alignment]
mapping_from = "OET-LV"
mapping_to = "OET-RV"
mapping_books = ["GEN", "EXO", "LEV", "NUM", "DEU", "JOS", "JDG", "RUT", "SA1", "SA2", "KI1", "KI2", "CH1", "CH2", "EZR", "NEH", "EST", "JOB", "PSA", "PRO", "ECC", "SNG", "ISA", "JER", "LAM", "EZE", "DAN", "HOS", "JOL", "AMO", "OBA", "JNA", "MIC", "NAH", "HAB", "ZEP", "HAG", "ZEC", "MAL", "ACT"]
chapter_pair_groups = ["DC"]
chapter_notice = "The DC editions are placed side by side by chapter only. Their verse numbering and textual contents differ; corresponding lines are not established equivalents."

[books]
default = ["MRK"]
collection_order = "oet"
order_label = "OET book order"
order_name = "oet"
settings_file = "/srv/FreelyGiven/OpenBibleData/createPages/settings.py"
settings_class = "State"
[books.collection_titles]
OT = "Hebrew Scriptures (Old Testament)"
NT = "The Messianic Update (New Testament)"
DC = "Deuterocanonical and other books"
ALL = "The Bible with deuterocanonical and other books"
[books.settings_keys]
ot = "OET_OT_BOOK_ORDER"
nt = "OET_NT_BOOK_ORDER"
dc = "OET_APOCRYPHA_BOOK_ORDER"
sequence = "OET_BOOK_ORDER"
dc_rv = "OET_RV_DC_BOOK_LIST"
dc_lv = "OET_LV_DC_BOOK_LIST"
aliases = "OET_SOURCE_BOOK_ALIASES"
draft_version = "OET_VERSION_NUMBER_STRING"

[batch]
output_dir = "../../OpenBibleData/htmlPages/OET/Downloads"
catalogue_file = "../../OpenEnglishTranslation-website/src/data/oet-pdfs.json"
cache_dir = "../.build/sile-downloads"
url_prefix = "https://Freely-Given.org/OBD/OET/Downloads/"
paper_size = "B5"
jobs = 4
collections = ["OT", "NT", "DC", "ALL"]
group_labels = { OT = "Hebrew Scriptures (Old Testament)", NT = "The Messianic Update (New Testament)", DC = "Deuterocanonical & other books", ALL = "All books" }

[batch.download_page]
enabled = true
title = "Open English Translation downloads"
stylesheets = ["../../BibleSite.css", "../../common.css"]
script = "../../theme.js"
logo_url = "../../oet-logo-wide.png"
logo_href = "https://OpenEnglishTranslation.Bible"
navigation = [{ label = "Open Bible Data Home", url = "../../index.htm#Top" }, { label = "About", url = "../../About.htm#Top" }, { label = "News", url = "../../News.htm#Top" }, { label = "OET Key", url = "../../OETKey.htm#Top" }]
introduction = ["Download the Open English Translation with the Readers’ Version and Literal Version side by side, in OET book order.", "Choose Print for black-and-white printing with full web addresses, or Online for colour and live links. Both editions have clickable links. For printing, use actual size, double-sided, with long-edge binding.", "Deuterocanonical and other books include early drafts. Where both versions are available, they are paired by chapter; their verses and lines do not necessarily correspond. Missing versions are identified in the PDFs."]

[preface]
source_side = "rv"
code = "FRT"
peripheral = "Preface"
label = "OET Readers’ Version preface"

[screen_colours]
link = "174EA6"
heading = "245B32"
border = "73AD21"
verse = "A52828"
call = "246B35"
title = "70365E"
wj = "8B4513"

[logos.opening]
enabled = true
screen = "/srv/FreelyGiven/OpenEnglishTranslation-website/OET-Logo-Files/03 Logo wide/oet-logo-wide.png"
print = "/srv/FreelyGiven/OpenEnglishTranslation-website/OET-Logo-Files/01 - Primary Logo/Digital (RGB)/OET-PrimaryLogo-RGB-Black.png"
href = "https://OpenEnglishTranslation.Bible"
height_pt = 42
max_width_pt = 300

[logos.ending]
enabled = true
screen = "/srv/FreelyGiven/OpenEnglishTranslation-website/OET-Logo-Files/02 - Logo Mark/Digital (RGB)/OET-LogoMark-RGB-FullColor.png"
print = "/srv/FreelyGiven/OpenEnglishTranslation-website/OET-Logo-Files/02 - Logo Mark/Digital (RGB)/OET-LogoMark-RGB-Black.png"
href = "https://OpenEnglishTranslation.Bible"
height_pt = 18
max_width_pt = 40

[logos.footer]
enabled = true
screen = "/srv/FreelyGiven/OpenEnglishTranslation-website/OET-Logo-Files/02 - Logo Mark/Digital (RGB)/OET-LogoMark-RGB-FullColor.png"
print = "/srv/FreelyGiven/OpenEnglishTranslation-website/OET-Logo-Files/02 - Logo Mark/Digital (RGB)/OET-LogoMark-RGB-Black.png"
href = "https://OpenEnglishTranslation.Bible"
height_pt = 10
max_width_pt = 20
